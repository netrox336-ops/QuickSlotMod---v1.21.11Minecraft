name: Публикация QuickSlot 1.0.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Сборка
        run: gradle build --stacktrace

      - name: Проверка JAR
        run: |
          test -f build/libs/quickslot-1.0.0.jar
          ls -lh build/libs/quickslot-1.0.0.jar

      - name: Создание GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/libs/quickslot-1.0.0.jar --clobber
          else
            gh release create v1.0.0 build/libs/quickslot-1.0.0.jar \
              --target "$GITHUB_SHA" \
              --title "QuickSlot 1.0.0 — Minecraft 1.21.11" \
              --notes "Первая версия QuickSlot для Minecraft Java 1.21.11 + Forge 61.2.0. Автоматическая раскладка хотбара, профили Normal/Rush/Bridge, перенос ресурсов из хотбара, HUD Iron/Gold/Diamond/Emerald и игровое меню настройки слотов."
          fi
