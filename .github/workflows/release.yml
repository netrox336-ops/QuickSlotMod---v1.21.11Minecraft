name: Публикация QuickSlot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'gradle.properties'
      - 'RELEASE_NOTES_*.md'
  push:
    branches: [main]
    paths:
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Узнать версию
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Сборка
        run: gradle build --stacktrace

      - name: Проверка JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "build/libs/quickslot-${VERSION}.jar"
          test -f "RELEASE_NOTES_v${VERSION}.md"
          ls -lh "build/libs/quickslot-${VERSION}.jar"

      - name: Создание GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          JAR="build/libs/quickslot-${VERSION}.jar"
          NOTES="RELEASE_NOTES_v${VERSION}.md"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$JAR" --clobber
          else
            gh release create "v${VERSION}" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "QuickSlot ${VERSION} — Minecraft 1.21.11" \
              --notes-file "$NOTES"
          fi
